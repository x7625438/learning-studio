version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rw-online-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - TEXT_MODEL=${TEXT_MODEL:-deepseek-v4-flash}
      - VISION_MODEL=${VISION_MODEL:-deepseek-v4-flash}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:80,http://localhost:5173}
      - ENABLE_VECTOR_SEARCH=${ENABLE_VECTOR_SEARCH:-0}
    volumes:
      - backend-data:/app/uploads
      - backend-db:/app
      - backend-vector:/app/vector_store
    networks:
      - rw-online-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rw-online-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rw-online-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  backend-data:
    driver: local
  backend-db:
    driver: local
  backend-vector:
    driver: local

networks:
  rw-online-network:
    driver: bridge
